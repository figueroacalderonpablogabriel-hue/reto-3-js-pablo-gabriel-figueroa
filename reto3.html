<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ordenar Arrays de Cadenas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <h1>Ordenar Arrays de Cadenas</h1>
    <hr>
    <p class="ayuda">
      Ingrese nombres en la caja de texto de abajo y ordene este listado, el cual aparecerá en el área de texto.
    </p>

    <div class="fila">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" autocomplete="off">
      <button type="button" id="btnAgregar" class="btn">Agregar y ordenar nombre</button>
    </div>

    <h2>Nombres ordenados</h2>
    <hr>

    <div class="fila fila-lista">
      <textarea id="listaNombres" readonly placeholder="Aquí aparecerán los nombres ordenados"></textarea>
      <button type="button" id="btnLimpiar" class="btn btn-pequeno">Limpiar</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
